# Media Proxy
# This function serves Google Drive images using server-side authentication.
# It must be publicly accessible (no JWT verification) to allow image display
# on public article pages. Security is maintained by validating file references
# in the database before serving.
[functions.media-proxy]
verify_jwt = false
